<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Россия RP — открытый мир</title>
<style>
*{box-sizing:border-box}html,body,#game{margin:0;width:100%;height:100%;overflow:hidden}body{font:14px system-ui;background:#8eb6cc;color:white}#game{position:fixed;inset:0}canvas{display:block}.panel{position:absolute;background:#101b25dd;border:1px solid #ffffff2b;border-radius:13px;padding:12px 14px;backdrop-filter:blur(8px)}#brand{top:12px;left:12px;font-weight:900;font-size:17px;letter-spacing:1px}#brand span,.money,h3{color:#62e6a5}#stats{top:12px;right:12px;text-align:right}.money{font-size:20px;font-weight:800}#mission{top:80px;left:12px;max-width:245px}h3{font-size:13px;margin:0 0 5px}p{margin:0;font-size:12px;line-height:1.45}#help{bottom:12px;left:12px;font-size:12px;line-height:1.5}#actions{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:7px}button{color:white;background:#17303b;border:1px solid #ffffff44;border-radius:11px;padding:12px;font-weight:700;min-width:135px}#toast{display:none;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:700}@media(max-width:650px){#help{display:none}#brand{font-size:14px}#mission{max-width:190px}button{min-width:110px;padding:10px;font-size:12px}}
</style></head><body><div id="game"></div><div id="brand" class="panel"><span>РОССИЯ</span> RP <div style="font-size:10px;color:#bdcbd5;font-weight:500;letter-spacing:0">ОТКРЫТЫЙ МИР · ПРОТОТИП 0.1</div></div><div id="stats" class="panel"><div style="font-size:10px;color:#bdcbd5">ИГРОВОЙ БАЛАНС</div><div class="money" id="money">₽ 1 500</div><div id="mode" style="font-size:10px;color:#bdcbd5">ПЕШКОМ</div></div><div id="mission" class="panel"><h3>ПЕРВОЕ ЗАДАНИЕ</h3><p id="missionText">Доберись до зелёной отметки и заработай ₽500.</p></div><div id="help" class="panel">W A S D — движение · мышь — обзор<br>E — сесть в машину / выйти<br>Найди зелёную отметку, чтобы выполнить работу.</div><div id="actions"><button id="job">▶ Начать работу</button><button id="vehicle">🚘 Сесть в машину</button><button id="reset">↻ Перезапустить</button></div><div id="toast" class="panel"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x91b9d0);scene.fog=new THREE.Fog(0x91b9d0,70,220);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff,0x56634c,2));const sun=new THREE.DirectionalLight(0xfff0d7,2);sun.position.set(-35,65,25);sun.castShadow=true;scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
box(500,.5,500,mat(0x668b61),0,-.4,0);
for(let i=-3;i<=3;i++){let p=i*32;box(10,.08,230,mat(0x343c44),p,.02,0);box(230,.08,10,mat(0x343c44),0,.025,p);box(1,.1,230,mat(0xb8b9ae),p-5.7,.05,0);box(230,.1,1,mat(0xb8b9ae),0,.05,p-5.7)}
const colors=[0xb8c5cb,0xc7b7a0,0x8b9eaa,0xd5c8b2,0x9aada0];for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++){if(!x&&!z)continue;for(let sx of [-1,1])for(let sz of [-1,1]){let bx=x*32+sx*10,bz=z*32+sz*10,h=9+Math.random()*22;box(8+Math.random()*3,h,8+Math.random()*3,mat(colors[Math.floor(Math.random()*colors.length)]),bx,h/2,bz)}}
for(let i=0;i<40;i++){let x=(Math.random()-.5)*190,z=(Math.random()-.5)*190;if(Math.abs(x%32)<7||Math.abs(z%32)<7)continue;box(.4,2,.4,mat(0x70513a),x,1,z);let crown=new THREE.Mesh(new THREE.ConeGeometry(1.5,4,7),mat(0x2d7048));crown.position.set(x,3.5,z);scene.add(crown)}
const player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,4,8),mat(0x246b83));body.position.y=1.25;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),mat(0xd6a27c));head.position.y=2.05;player.add(head);player.position.set(0,0,7);
const car=new THREE.Group();scene.add(car);car.position.set(4,0,12);const cb=new THREE.Mesh(new THREE.BoxGeometry(2.2,.7,4.1),mat(0x2f8d68));cb.position.y=.65;car.add(cb);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.65,.72,1.9),new THREE.MeshStandardMaterial({color:0x7ec4d6,roughness:.25}));cabin.position.set(0,1.32,-.25);car.add(cabin);for(let x of [-1,1])for(let z of [-1.35,1.35]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.22,16),mat(0x171b20));w.rotation.z=Math.PI/2;w.position.set(x,.35,z);car.add(w)}
const marker=new THREE.Group();scene.add(marker);marker.position.set(0,0,-28);const ring=new THREE.Mesh(new THREE.TorusGeometry(2,.16,8,32),mat(0x52f2a0));ring.rotation.x=-Math.PI/2;ring.position.y=.2;marker.add(ring);const beam=new THREE.Mesh(new THREE.CylinderGeometry(.12,.5,3,16,true),new THREE.MeshBasicMaterial({color:0x52f2a0,transparent:true,opacity:.2}));beam.position.y=1.7;marker.add(beam);
let inCar=false,working=false,done=false,money=1500,speed=0,yaw=0,pitch=.18;const keys={};function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}function refresh(){document.querySelector('#money').textContent='₽ '+money.toLocaleString('ru-RU');document.querySelector('#mode').textContent=inCar?'ЗА РУЛЁМ':'ПЕШКОМ';document.querySelector('#vehicle').textContent=inCar?'🚶 Выйти из машины':'🚘 Сесть в машину';document.querySelector('#job').textContent=working?'■ Отменить работу':'▶ Начать работу';document.querySelector('#missionText').textContent=done?'Задание выполнено! Исследуй город.':working?'Доберись до зелёной отметки.':'Нажми «Начать работу», затем доберись до зелёной отметки.'}
function toggleCar(){if(inCar){player.position.copy(car.position);player.position.x+=2;inCar=false;toast('Ты вышел из автомобиля.')}else if(player.position.distanceTo(car.position)<5){inCar=true;toast('Ты сел в автомобиль. Используй WASD.')}else toast('Подойди ближе к зелёному автомобилю.');refresh()}document.querySelector('#vehicle').onclick=toggleCar;document.querySelector('#job').onclick=()=>{working=!working;if(working){done=false;toast('Работа началась! Найди зелёную отметку.')}else toast('Работа отменена.');refresh()};document.querySelector('#reset').onclick=()=>{player.position.set(0,0,7);car.position.set(4,0,12);inCar=working=done=false;money=1500;speed=0;refresh();toast('Прототип перезапущен.')};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')toggleCar()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let drag=false,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-lx)*.005;pitch=Math.max(-.05,Math.min(.65,pitch+(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY}});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);marker.rotation.y+=dt*.55;let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);if(inCar){if(f)speed+=f*dt*12;else speed*=Math.pow(.06,dt);speed=Math.max(-9,Math.min(19,speed));car.rotation.y+=s*dt*1.5*(Math.abs(speed)/10+.2);car.position.x+=Math.sin(car.rotation.y)*speed*dt;car.position.z+=Math.cos(car.rotation.y)*speed*dt;car.position.x=Math.max(-108,Math.min(108,car.position.x));car.position.z=Math.max(-108,Math.min(108,car.position.z));player.position.copy(car.position)}else{let len=Math.hypot(f,s);if(len){let dx=(Math.sin(yaw)*f+Math.cos(yaw)*s)/len,dz=(Math.cos(yaw)*f-Math.sin(yaw)*s)/len;player.position.x+=dx*dt*7;player.position.z+=dz*dt*7;player.rotation.y=Math.atan2(dx,dz)}player.position.x=Math.max(-108,Math.min(108,player.position.x));player.position.z=Math.max(-108,Math.min(108,player.position.z))}
let target=inCar?car.position:player.position;if(working&&!done&&target.distanceTo(marker.position)<4){done=true;working=false;money+=500;toast('Работа выполнена! Получено ₽500.');refresh()}let focus=target.clone();focus.y+=inCar?1.1:1.3;camera.position.lerp(new THREE.Vector3(focus.x+Math.sin(yaw)*(inCar?10:7.5),focus.y+3+pitch*8,focus.z+Math.cos(yaw)*(inCar?10:7.5)),1-Math.pow(.001,dt));camera.lookAt(focus);renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});refresh();animate();
</script></body></html>
